ign:center}.modal h2{font-size:28px;margin:0 0 10px}.modal p{color:var(--muted);line-height:1.65}.modal-actions{display:flex;gap:10px;margin-top:18px}.modal-actions button{flex:1}

<div class="app">

    <div class="progress-wrap"><div class="progress-label"><span id="progressText">關卡進度 0 / 13</span><span id="abilityText">觀察 0｜規劃 0｜操作 0</span></div><div class="progress"><div id="progressBar"></div></div></div>

<script>
const COLORS={U:'#f2cf3a',D:'#f7f4e9',F:'#42a66b',B:'#397bc2',R:'#d94d45',L:'#ef8d32'};
const FACE_NAMES={U:'黃／上',D:'白／下',F:'綠／前',B:'藍／後',R:'紅／右',L:'橙／左'};
let stickers=[];
function makeSolved(){
  stickers=[]; let id=0;
  const add=(face,pos,normal)=>stickers.push({id:id++,color:face,pos:{...pos},normal:{...normal}});
  for(let r=0;r<3;r++)for(let c=0;c<3;c++){
    add('F',{x:c-1,y:1-r,z:1},{x:0,y:0,z:1});
    add('B',{x:1-c,y:1-r,z:-1},{x:0,y:0,z:-1});
    add('U',{x:c-1,y:1,z:r-1},{x:0,y:1,z:0});
    add('D',{x:c-1,y:-1,z:1-r},{x:0,y:-1,z:0});
    add('R',{x:1,y:1-r,z:1-c},{x:1,y:0,z:0});
    add('L',{x:-1,y:1-r,z:c-1},{x:-1,y:0,z:0});
  }
}
function rotVec(v,axis,q){ q=((q%4)+4)%4; let a={...v}; for(let i=0;i<q;i++){let {x,y,z}=a;if(axis==='x')a={x,y:-z,z:y};if(axis==='y')a={x:z,y,z:-x};if(axis==='z')a={x:-y,y:x,z};}return a; }
function parseMove(m){let face=m[0], prime=m.includes("'"), twice=m.includes('2');return{face,prime,twice}}
function moveSpec(face){const defs={U:['y',1],D:['y',-1],R:['x',1],L:['x',-1],F:['z',1],B:['z',-1],u:['y',1]};return{axis:defs[face][0],sign:defs[face][1],wide:face==='u'}}
function moveIncludesSticker(s,spec){return spec.wide?s.pos[spec.axis]>=0:s.pos[spec.axis]===spec.sign}
function applyMove(m,record=true,rerender=true){
  const {face,prime,twice}=parseMove(m),spec=moveSpec(face); const {axis,sign}=spec; let q=(-sign)*(prime?-1:1); let reps=twice?2:1;
  for(let k=0;k<reps;k++) stickers.forEach(s=>{if(moveIncludesSticker(s,spec)){s.pos=rotVec(s.pos,axis,q);s.normal=rotVec(s.normal,axis,q)}});
  if(record){moveHistory.push(m);stateHistory.push(cloneState());levelMoveCount++;}
  if(rerender){renderCube();renderTimeline();updateLiveChecks();}
}
function inverseMove(m){if(m.includes('2'))return m;return m.includes("'")?m[0]:m[0]+"'"}
function applySequence(seq,record=false){seq.filter(Boolean).forEach(m=>applyMove(m,record,false));renderCube();renderTimeline();updateLiveChecks()}
function cloneState(){return stickers.map(s=>({id:s.id,color:s.color,pos:{...s.pos},normal:{...s.normal}}))}
function restoreState(st){stickers=st.map(s=>({id:s.id,color:s.color,pos:{...s.pos},normal:{...s.normal}}));renderCube();updateLiveChecks()}
function stateKey(){return stickers.slice().sort((a,b)=>a.id-b.id).map(s=>`${s.id}:${s.pos.x}${s.pos.y}${s.pos.z}:${s.normal.x}${s.normal.y}${s.normal.z}`).join('|')}
function faceOfNormal(n){if(n.y===1)return'U';if(n.y===-1)return'D';if(n.z===1)return'F';if(n.z===-1)return'B';if(n.x===1)return'R';return'L'}
function rcFor(face,p){if(face==='F')return[1-p.y,p.x+1];if(face==='B')return[1-p.y,1-p.x];if(face==='U')return[p.z+1,p.x+1];if(face==='D')return[1-p.z,p.x+1];if(face==='R')return[1-p.y,1-p.z];return[1-p.y,p.z+1]}
function stickerAt(face,r,c){return stickers.find(s=>faceOfNormal(s.normal)===face&&rcFor(face,s.pos)[0]===r&&rcFor(face,s.pos)[1]===c)}
let selectedIds=new Set(), classifiedPieceKeys=new Set(), whiteEdgeKeys=new Set(), whiteEdgeTypes=new Set(), workspaceLocations=new Set(), workspacePieceIds=new Set(), targetPieceIds=new Set(), frontColorSelected=false, markMode=false;
let viewX=-24,viewY=-36,isDragging=false,lastPointer={x:0,y:0},moveAnimating=false,dragMoved=false;
let canvas,ctx,hitRegions=[],animState=null,keyboardStickerId=null,lastPointerSelectionAt=0;
const VIEW_PRESETS={home:[-24,-36],U:[-89,0],D:[89,0],F:[0,0],B:[0,180],R:[0,-90],L:[0,90]};
function deg2rad(d){return d*Math.PI/180}
function rotateAroundX(p,deg){const a=deg2rad(deg),c=Math.cos(a),s=Math.sin(a);return{x:p.x,y:p.y*c-p.z*s,z:p.y*s+p.z*c}}
function rotateAroundY(p,deg){const a=deg2rad(deg),c=Math.cos(a),s=Math.sin(a);return{x:p.x*c+p.z*s,y:p.y,z:-p.x*s+p.z*c}}
function rotateAroundAxis(p,axis,deg){if(axis==='x')return rotateAroundX(p,deg);if(axis==='y')return rotateAroundY(p,deg);const a=deg2rad(deg),c=Math.cos(a),s=Math.sin(a);return{x:p.x*c-p.y*s,y:p.x*s+p.y*c,z:p.z}}
function transformView(p){return rotateAroundX(rotateAroundY(p,viewY),viewX)}
function transformNormal(n){return transformView(n)}
function projectPoint(p,w,h){const cam=8, scale=Math.min(w,h)*0.92;const f=scale/(cam-p.z);return{x:w/2+p.x*f,y:h/2-p.y*f,z:p.z}}
function quadFor(face,pos,size){const s=size;const x=pos.x,y=pos.y,z=pos.z;
  if(face==='F')return[{x:x-s,y:y+s,z:1.5},{x:x+s,y:y+s,z:1.5},{x:x+s,y:y-s,z:1.5},{x:x-s,y:y-s,z:1.5}];
  if(face==='B')return[{x:x+s,y:y+s,z:-1.5},{x:x-s,y:y+s,z:-1.5},{x:x-s,y:y-s,z:-1.5},{x:x+s,y:y-s,z:-1.5}];
  if(face==='U')return[{x:x-s,y:1.5,z:z-s},{x:x+s,y:1.5,z:z-s},{x:x+s,y:1.5,z:z+s},{x:x-s,y:1.5,z:z+s}];
  if(face==='D')return[{x:x-s,y:-1.5,z:z+s},{x:x+s,y:-1.5,z:z+s},{x:x+s,y:-1.5,z:z-s},{x:x-s,y:-1.5,z:z-s}];
  if(face==='R')return[{x:1.5,y:y+s,z:z+s},{x:1.5,y:y+s,z:z-s},{x:1.5,y:y-s,z:z-s},{x:1.5,y:y-s,z:z+s}];
  return[{x:-1.5,y:y+s,z:z-s},{x:-1.5,y:y+s,z:z+s},{x:-1.5,y:y-s,z:z+s},{x:-1.5,y:y-s,z:z-s}];
}
function pointInPoly(pt,poly){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i].x,yi=poly[i].y,xj=poly[j].x,yj=poly[j].y;const inter=((yi>pt.y)!==(yj>pt.y))&&(pt.x<(xj-xi)*(pt.y-yi)/(yj-yi+1e-9)+xi);if(inter)inside=!inside}return inside}
function resizeCanvas(){canvas=document.getElementById('cubeCanvas');ctx=canvas.getContext('2d');const ratio=window.devicePixelRatio||1;const rect=canvas.getBoundingClientRect();canvas.width=Math.max(320,Math.floor(rect.width*ratio));canvas.height=Math.max(260,Math.floor(rect.height*ratio));ctx.setTransform(ratio,0,0,ratio,0,0)}
function stickerRenderData(s,w,h){const face=faceOfNormal(s.normal);const isMoving=animState&&moveIncludesSticker(s,animState.spec);const angle=isMoving?animState.currentDeg:0;const base=quadFor(face,s.pos,0.50).map(p=>isMoving?rotateAroundAxis(p,animState.axis,angle):p);const sticker=quadFor(face,s.pos,0.39).map(p=>isMoving?rotateAroundAxis(p,animState.axis,angle):p);let normal={...s.normal}; if(isMoving)normal=rotateAroundAxis(normal,animState.axis,angle);
  const viewNormal=transformNormal(normal); if(viewNormal.z<=0.02)return null;
  const base2=base.map(transformView); const sticker2=sticker.map(transformView);
  const baseP=base2.map(p=>projectPoint(p,w,h)); const stickerP=sticker2.map(p=>projectPoint(p,w,h));
  const depth=sticker2.reduce((a,p)=>a+p.z,0)/4; const [r,c]=rcFor(face,s.pos);

}
function drawPoly(poly,fill,stroke,lineWidth=1){ctx.beginPath();ctx.moveTo(poly[0].x,poly[0].y);for(let i=1;i<poly.length;i++)ctx.lineTo(poly[i].x,poly[i].y);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lineWidth;ctx.stroke()}}

}

function middleEdgeAtHome(side){return side==='right'?stickerAt('F',1,2)?.color==='F'&&stickerAt('R',1,0)?.color==='R':stickerAt('F',1,0)?.color==='F'&&stickerAt('L',1,2)?.color==='L'}

const COMPLETED_KEY='cube8355_completed_v2',ABILITIES_KEY='cube8355_abilities_v2';
let currentLevel=1,currentLevelDef=null,completed=new Set(JSON.parse(localStorage.getItem(COMPLETED_KEY)||'[]')),abilities=JSON.parse(localStorage.getItem(ABILITIES_KEY)||'{"observe":0,"plan":0,"operate":0}');
let moveHistory=[],stateHistory=[],startState=[],targetKey='',levelMoveCount=0,quizCorrect=false,notationIndex=0,classification={center:0,edge:0,corner:0},hintUsed=0,extraSelection=false;
function buildLevelList(){const el=document.getElementById('levelList');el.innerHTML='';let last='';LEVELS.forEach(l=>{if(l.chapter!==last){const h=document.createElement('div');h.className='chapter';h.textContent=l.chapter;el.appendChild(h);last=l.chapter}const b=document.createElement('button');b.className='level-btn'+(l.id===currentLevel?' active':'')+(completed.has(l.id)?' done':'');b.innerHTML=`<span class="level-num">${completed.has(l.id)?'✓':l.id}</span><span><div class="level-name">${l.title}</div><div class="level-sub">${l.sub}</div></span>`;b.onclick=()=>loadLevel(l.id);el.appendChild(b)})}
function loadLevel(id){currentLevel=id;currentLevelDef=LEVELS[id-1];[viewX,viewY]=VIEW_PRESETS.home;selectedIds.clear();classifiedPieceKeys.clear();whiteEdgeKeys.clear();whiteEdgeTypes.clear();workspaceLocations.clear();workspacePieceIds.clear();targetPieceIds.clear();frontColorSelected=false;keyboardStickerId=null;markMode=false;moveHistory=[];stateHistory=[];levelMoveCount=0;quizCorrect=false;notationIndex=0;classification={center:0,edge:0,corner:0};hintUsed=0;extraSelection=false;makeSolved();if(currentLevelDef.scramble)applySequence(currentLevelDef.scramble,false);if(currentLevelDef.showWorkspace){stickers.filter(s=>s.pos.x===1&&s.pos.y===0&&s.pos.z===1).forEach(s=>workspacePieceIds.add(s.id));const targets=currentLevelDef.targetEdges||[];stickers.filter(s=>{const colors=cubieColors(s);return pieceType(s)==='edge'&&targets.some(([a,b])=>colors.has(a)&&colors.has(b))}).forEach(s=>targetPieceIds.add(s.id))}startState=cloneState();stateHistory=[cloneState()];
  if(currentLevelDef.type==='sequence'||currentLevelDef.type==='sequencePlusSelect'){let temp=cloneState();applySequence(currentLevelDef.solution,false);targetKey=stateKey();restoreState(temp)}else targetKey='';
  document.getElementById('missionTag').textContent=`第 ${id} 關｜${currentLevelDef.tag}`;document.getElementById('missionTitle').textContent=currentLevelDef.title;document.getElementById('missionDesc').textContent=currentLevelDef.desc;document.getElementById('workspaceText').textContent=currentLevelDef.workspace;document.getElementById('hintBox').textContent='先觀察目標塊、目標位置與可暫時移動的區域。';document.getElementById('statusBox').className='status';document.getElementById('statusBox').textContent=currentLevelDef.startStatus||(currentLevelDef.type==='classification'?'第 1 步：請先選取 1 個中心塊。':'尚未開始。');
  buildLevelList();renderCube();renderMoves();renderQuiz();renderChecklist();renderTimeline();renderBadges();updateProgress();updateContextualUI();
}
function isOperationLevel(){return ['notation','sequence','sequencePlusSelect'].includes(currentLevelDef.type)}
function renderMoves(){
  const el=document.getElementById('moveButtons');el.innerHTML='';
  if(!isOperationLevel())return;
  const source=currentLevelDef.type==='notation'?currentLevelDef.sequence:(currentLevelDef.solution||[]);
  const faces=[...new Set(source.map(x=>x[0]))];
  faces.forEach(f=>{
    const group=document.createElement('div');group.className='move-face';
    const label=document.createElement('span');label.className='move-face-label';label.textContent=f==='u'?'上＋中':f;group.appendChild(label);
    const candidates=[f,f+"'",f+'2'].filter((x,i,a)=>source.includes(x)||i<2);
    [...new Set(candidates)].forEach(m=>{const b=document.createElement('button');b.className='move';b.textContent=m;b.onclick=()=>handleMove(m);group.appendChild(b)});
    el.appendChild(group);
  });
}
function commitAnimatedMove(m,after){
  if(moveAnimating)return;
  animateMove(m,()=>{applyMove(m,false);moveHistory.push(m);stateHistory.push(cloneState());levelMoveCount++;renderTimeline();updateLiveChecks();after&&after()});
}
function handleMove(m){
  if(currentLevelDef.type==='notation'){
    const expected=currentLevelDef.sequence[notationIndex];
    if(m!==expected){setStatus(`目前應執行 ${expected}，你選擇了 ${m}。`,true);return}
    commitAnimatedMove(m,()=>{notationIndex++;setStatus(`完成 ${notationIndex} / ${currentLevelDef.sequence.length} 次指定操作。`);updateLiveChecks()});
  }else{
    if(currentLevelDef.requiresFrontColor&&!frontColorSelected){setStatus('請先點選前面正中央的綠色中心，選定前方顏色。',true);return}
    const expected=currentLevelDef.solution?.[moveHistory.length];
    const requireFormulaOrder=['middleRight','middleBoth','keyholeTarget','middleThree'].includes(currentLevelDef.successCheck);
    if(requireFormulaOrder&&expected&&m!==expected){setStatus(`8355 工作區流程尚未到這一步；目前應按 ${expected==='u'?'上＋中層一起轉（u）':expected}。`,true);return}
    commitAnimatedMove(m,()=>{if(expected&&m===expected){const firstStep=moveHistory.length===1?'車廂已開到工作區。':'';setStatus(`${firstStep} 第 ${moveHistory.length} / ${currentLevelDef.solution.length} 步正確。`)}else if(expected)setStatus('這一步與訓練路徑不同。可復原一步或自行修正。',true);updateLiveChecks()});
  }
}
function pieceType(s){let zeros=[s.pos.x,s.pos.y,s.pos.z].filter(v=>v===0).length;return zeros===2?'center':zeros===1?'edge':'corner'}
function classificationTarget(){if(classification.center<1)return{type:'center',label:'中心塊',needed:1,done:classification.center};if(classification.edge<4)return{type:'edge',label:'邊塊',needed:4,done:classification.edge};return{type:'corner',label:'角塊',needed:4,done:classification.corner}}
function handleStickerClick(s,face,r,c){const t=currentLevelDef.type;
  if(t==='select'){if(currentLevelDef.selectRule({s,face,r,c})){if(selectedIds.has(s.id)){selectedIds.delete(s.id);setStatus(`已取消選取；目前找到 ${selectedIds.size} / 6 個中心塊。`)}else{selectedIds.add(s.id);setStatus(`已找到 ${selectedIds.size} / 6 個中心塊。`)}}else setStatus('這不是中心位置。中心位於每一面正中央。',true)}
  else if(t==='classification'){let p=pieceType(s),key=`${p}:${positionKey(s)}`,target=classificationTarget();if(p!==target.type)setStatus(`目前要找 ${target.label}（${target.done} / ${target.needed}），請依序完成分類。`,true);else if(classifiedPieceKeys.has(key))setStatus('這個實體方塊已辨識過，請選擇不同位置。',true);else{classifiedPieceKeys.add(key);classification[p]++;selectedIds.add(s.id);let next=classificationTarget();if(classification.corner>=4)setStatus('中心、邊、角已依序完成；請回答角塊住所的概念題。');else if(next.type!==p)setStatus(`已完成 ${target.label}；下一步請找 ${next.needed} 個${next.label}。`);else setStatus(`目前找 ${target.label}：${next.done} / ${next.needed}。`)}}
  else if(t==='selectColor'){if(s.color==='D'&&r===1&&c===1){selectedIds.add(s.id);setStatus('已選定白色中心為底面。')}else setStatus('請選擇白色中心，而不是白色角塊或邊塊。',true)}
  else if(t==='whiteEdges'){const key=positionKey(s),colors=cubieColors(s),sideColor=[...colors].find(color=>color!=='D');if(pieceType(s)==='edge'&&colors.has('D')){if(whiteEdgeKeys.has(key))setStatus('這顆白色邊塊已辨識過，請找另一顆。',true);else{whiteEdgeKeys.add(key);whiteEdgeTypes.add(sideColor);selectedIds.add(s.id);setStatus(`已找到白${FACE_NAMES[sideColor].split('／')[0]}邊；目前 ${whiteEdgeKeys.size} / 4 顆。`)}}else setStatus('請選擇含白色的邊塊；可點白色面或另一個顏色面。',true)}
  else if(t==='workspaceSelect'){if(face==='D'&&r===0&&c===2){selectedIds.add(s.id);setStatus('已選定白底右前角作為空槽。')}else setStatus('工作區設定為白底右前角。',true)}
  else if(t==='sequencePlusSelect'){if(face==='D'&&r===0&&c===2){extraSelection=true;selectedIds.add(s.id);setStatus('已再次確認右前空槽。')}else setStatus('請指出白底右前角工作區。',true)}
  else if(t==='sequence'&&currentLevelDef.requiresFrontColor){if(face==='F'&&r===1&&c===1){frontColorSelected=true;selectedIds.add(s.id);setStatus(['keyholeTarget','middleThree'].includes(currentLevelDef.successCheck)?'已選定綠色中心為前方。現在按「上＋中」的 u，將目標住所開到虛線工作區。':'已選定綠色中心為前方顏色。現在按 U，讓目標邊的綠色貼紙與它對齊。')}else setStatus('請先點選前面正中央的綠色中心；這不是目標邊塊，也不是底面。',true)}
  else if(t==='Lworkspace'){let location=(face==='D'&&r===0&&c===2)?'corner':((face==='F'&&r===1&&c===2)||(face==='R'&&r===1&&c===0))?'edge':'';if(location){workspaceLocations.add(location);selectedIds.add(s.id);setStatus(`已標示 ${workspaceLocations.has('corner')?'底層空角':'中層邊槽'}；仍需找到 ${workspaceLocations.has('corner')&&workspaceLocations.has('edge')?'概念題答案':'另一個工作區位置'}。`)}else setStatus('請選擇右前底角或其上方中層邊槽。',true)}
  else if(t==='targetEdge'){const colors=cubieColors(s);if(pieceType(s)==='edge'&&colors.size===2&&colors.has('L')&&colors.has('B')){selectedIds.add(s.id);setStatus('已標示橙藍邊塊。請完成住所判斷。')}else setStatus('目標是同時含橙色與藍色的同一顆邊塊。',true)}
  renderCube();updateLiveChecks(); }
function renderQuiz(){const q=currentLevelDef.quiz;const a=document.getElementById('quizArea');a.innerHTML=`<div style="font-size:13px;line-height:1.55;margin-bottom:10px">${q.q}</div><div class="quiz-options">${q.opts.map((o,i)=>`<button class="quiz-option" data-i="${i}">${o}</button>`).join('')}</div>`;a.querySelectorAll('.quiz-option').forEach(b=>b.onclick=()=>{a.querySelectorAll('.quiz-option').forEach(x=>x.classList.remove('correct','wrong'));let i=+b.dataset.i;if(i===q.answer){b.classList.add('correct');quizCorrect=true;setStatus('概念判斷正確。')}else{b.classList.add('wrong');quizCorrect=false;setStatus('此判斷無法解釋目前策略。重新比對目標塊、住所與工作區。',true)}updateLiveChecks()})}
function conditionStates(){const t=currentLevelDef.type;let arr=[];
 if(t==='select')arr=[selectedIds.size>=6,quizCorrect];
 if(t==='classification')arr=[classification.center>=1,classification.edge>=4,classification.corner>=4,quizCorrect];
 if(t==='notation')arr=[notationIndex>=6,quizCorrect];
 if(t==='selectColor')arr=[selectedIds.size>=1,quizCorrect];
 if(t==='whiteEdges')arr=[whiteEdgeTypes.has('R'),whiteEdgeTypes.has('F'),whiteEdgeTypes.has('L'),whiteEdgeTypes.has('B'),quizCorrect];
 if(t==='sequence'){const check=currentLevelDef.successCheck;if(check==='middleRight')arr=[frontColorSelected&&moveHistory[0]==='U',middleEdgeAtHome('right'),moveHistory.length===currentLevelDef.solution.length,quizCorrect];else if(check==='keyholeTarget')arr=[frontColorSelected,middleEdgeAtHome('left'),quizCorrect];else if(check==='middleThree')arr=[frontColorSelected,middleThreeEdgesSolved(),quizCorrect];else if(check==='middleBoth')arr=[middleEdgeAtHome('right'),middleEdgeAtHome('left'),moveHistory.length===currentLevelDef.solution.length,quizCorrect];else arr=[check==='whiteCross'?whiteCrossSolved():stateKey()===targetKey,moveHistory.length<=currentLevelDef.solution.length+2,quizCorrect]}
 if(t==='workspaceSelect')arr=[selectedIds.size>=1,quizCorrect];
 if(t==='sequencePlusSelect')arr=[stateKey()===targetKey,extraSelection,quizCorrect];
 if(t==='Lworkspace')arr=[workspaceLocations.has('corner'),workspaceLocations.has('edge')&&quizCorrect];
 if(t==='targetEdge')arr=[selectedIds.size>=1,quizCorrect,quizCorrect];
 return arr; }
function renderChecklist(){const states=conditionStates();document.getElementById('checklist').innerHTML=currentLevelDef.checks.map((c,i)=>`<div class="check ${states[i]?'done':''}"><span class="dot">${states[i]?'✓':'·'}</span><span>${c}</span></div>`).join('')}
function updateLiveChecks(){renderChecklist();renderBadges();updateContextualUI()}
function updateContextualUI(){
  const operation=isOperationLevel();
  document.getElementById('controlsPanel').hidden=!operation;
  document.getElementById('controlCaption').textContent=['keyholeTarget','middleThree'].includes(currentLevelDef?.successCheck)?'8355 操作：u＝上層＋中層一起轉；白色底層固定不動。':'選擇要轉動的面與方向';
  document.getElementById('hintCard').hidden=!operation;
  document.getElementById('viewHelp').hidden=false;
  document.getElementById('undoBtn').hidden=!operation||moveHistory.length===0;
  document.getElementById('resetLevelBtn').hidden=!operation||moveHistory.length===0;
  document.getElementById('rotateViewBtn').hidden=![1,4].includes(currentLevel);
  const ready=allPassed();
  const check=document.getElementById('checkBtn');check.hidden=!ready;
  check.textContent=operation?'檢查結果並過關':'完成本關';
  document.getElementById('statusCard').hidden=false;
}
function renderTimeline(){const el=document.getElementById('timeline');el.innerHTML=moveHistory.length?moveHistory.map((m,i)=>`<span class="step">${i+1}. ${m}</span>`).join(''):'<span class="empty">尚未執行轉動</span>'}
function renderBadges(){let badges=[];if(hintUsed===0)badges.push('尚未使用提示');else badges.push(`已用提示 ${hintUsed}`);badges.push(`轉動 ${levelMoveCount} 步`);if(quizCorrect)badges.push('概念檢核完成');document.getElementById('badgeRow').innerHTML=badges.map(x=>`<span class="badge">${x}</span>`).join('')}
function setStatus(msg,err=false){const s=document.getElementById('statusBox');s.textContent=msg;s.className='status'+(err?' error':'')}
function allPassed(){return conditionStates().every(Boolean)}
function completeLevel(){if(!allPassed()){setStatus('尚未同時滿足操作結果與概念檢核。',true);return}if(!completed.has(currentLevel)){completed.add(currentLevel);abilities[currentLevelDef.score]=Math.min(100,abilities[currentLevelDef.score]+8);localStorage.setItem(COMPLETED_KEY,JSON.stringify([...completed]));localStorage.setItem(ABILITIES_KEY,JSON.stringify(abilities))}updateProgress();buildLevelList();document.getElementById('modalTitle').textContent=`第 ${currentLevel} 關完成`;document.getElementById('modalText').textContent=`你已完成「${currentLevelDef.title}」。本關使用 ${levelMoveCount} 次轉動、${hintUsed} 次提示。`;document.getElementById('nextBtn').style.display=currentLevel<13?'block':'none';document.getElementById('overlay').classList.add('show')}
function updateProgress(){document.getElementById('progressText').textContent=`關卡進度 ${completed.size} / 13`;document.getElementById('progressBar').style.width=`${completed.size/13*100}%`;document.getElementById('abilityText').textContent=`觀察 ${abilities.observe}｜規劃 ${abilities.plan}｜操作 ${abilities.operate}`}
function showHint(n){hintUsed++;let text='';if(n===1)text='注意力提示：先找目標塊，再找它應位於哪些中心塊的交界。';if(n===2)text='方向提示：工作區固定在白底右前方。先讓住所靠近工作區。';if(n===3){let next=currentLevelDef.solution?.[moveHistory.length]||currentLevelDef.sequence?.[notationIndex];text=next?`下一步需要操作：${next}`:'本關沒有固定下一步，先完成選取或概念判斷。'}if(n===4){text=currentLevelDef.solution?`完整訓練序列：${currentLevelDef.solution.join(' → ')}`:'完整示範：中心在面中央；邊在兩面交界；角在三面交界。'}document.getElementById('hintBox').textContent=text;renderBadges()}
document.querySelectorAll('.hint-btn').forEach(b=>b.onclick=()=>showHint(+b.dataset.hint));
document.getElementById('undoBtn').onclick=()=>{if(moveHistory.length){moveHistory.pop();stateHistory.pop();restoreState(stateHistory[stateHistory.length-1]);levelMoveCount=Math.max(0,levelMoveCount-1);renderTimeline();setStatus('已復原一步。')}};
document.getElementById('resetLevelBtn').onclick=()=>loadLevel(currentLevel);
document.getElementById('rotateViewBtn').onclick=()=>{markMode=!markMode;document.getElementById('rotateViewBtn').textContent=markMode?'隱藏中心標記':'顯示中心標記';renderCube()};
document.getElementById('homeViewBtn').onclick=()=>{[viewX,viewY]=VIEW_PRESETS.home;renderCube()};
document.getElementById('checkBtn').onclick=completeLevel;
document.getElementById('stayBtn').onclick=()=>document.getElementById('overlay').classList.remove('show');
document.getElementById('nextBtn').onclick=()=>{document.getElementById('overlay').classList.remove('show');loadLevel(Math.min(13,currentLevel+1))};
document.getElementById('resetAll').onclick=()=>{if(!confirm('確定要清除所有關卡進度嗎？'))return;localStorage.removeItem(COMPLETED_KEY);localStorage.removeItem(ABILITIES_KEY);completed.clear();abilities={observe:0,plan:0,operate:0};loadLevel(1)};
buildFaceNavigator();
init3DInteraction();
loadLevel(1);
